name: CI RSpec Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }} / ${{ matrix.orm }}
    runs-on: ubuntu-latest
    env:
      CI: true
      TESTOPTS: -v
      RAILS: ${{ matrix.rails }}
      BUNDLE_GEMFILE: gemfiles/Gemfile.${{ matrix.orm }}.rb
    strategy:
      fail-fast: false
      matrix:
        orm: ['mongoid8', 'mongoid9']
        ruby: ['3.2', '3.3', '3.4']
        rails: ['7.1', '7.2', '8.0']

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '7.0'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        timeout-minutes: 10
        run: bundle exec rake spec

  edge:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }} / ${{ matrix.orm }} (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CI: true
      TESTOPTS: -v
      RAILS: ${{ matrix.rails }}
      BUNDLE_GEMFILE: gemfiles/Gemfile.${{ matrix.orm }}.rb
    strategy:
      fail-fast: false
      matrix:
        orm: ['mongoid9']
        ruby: ['head', 'jruby-head', 'truffleruby-head']
        rails: ['8.0']

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '7.0'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        timeout-minutes: 10
        run: bundle exec rake spec
